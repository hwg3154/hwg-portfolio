<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resumé & Contact — Harrison Grant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="site-nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand">Engineering Portfolio</a>
      <button class="nav-toggle" aria-label="Menu" onclick="document.querySelector('.nav-links').classList.toggle('open')">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="resume.html" class="active">Resumé &amp; Contact</a></li>
        <li>
          <a href="https://www.linkedin.com/in/harrisongrant04/" target="_blank" rel="noopener" class="nav-linkedin" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Contact Content — filled by JavaScript -->
  <div class="contact-page" id="contact-page"></div>

  <!-- Footer -->
  <footer class="site-footer">
    &copy; <span id="year"></span> Harrison Grant
  </footer>

  <script src="projects.js"></script>
  <script>
    const page = document.getElementById('contact-page');
    page.innerHTML = `
      <h1 class="fade-in">Resumé &amp; Contact</h1>
      <div class="contact-grid">
        <div class="contact-info fade-in">
          <h2>Get in Touch</h2>
          <p><strong>Email:</strong> <a href="mailto:${SITE_CONFIG.email}">${SITE_CONFIG.email}</a></p>
          <p><strong>Phone:</strong> <a href="tel:${SITE_CONFIG.phone}">${SITE_CONFIG.phone}</a></p>
          <p><strong>LinkedIn:</strong> <a href="${SITE_CONFIG.linkedIn}" target="_blank" rel="noopener">linkedin.com/in/harrisongrant04</a></p>
          <a href="${SITE_CONFIG.resumeFile}" download class="btn">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 1v10m0 0L4.5 7.5M8 11l3.5-3.5M2 14h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Download Resumé
          </a>
        </div>
        <div class="resume-preview fade-in">
          <img src="images/resume-preview.jpg" alt="Resumé preview">
        </div>
      </div>
    `;

    document.getElementById('year').textContent = new Date().getFullYear();

    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.1 });
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
  </script>
</body>
</html>
