<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harrison Grant — Engineering Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="site-nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand">Engineering Portfolio</a>
      <button class="nav-toggle" aria-label="Menu" onclick="document.querySelector('.nav-links').classList.toggle('open')">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="resume.html">Resumé &amp; Contact</a></li>
        <li>
          <a href="https://www.linkedin.com/in/harrisongrant04/" target="_blank" rel="noopener" class="nav-linkedin" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Hero Section — filled by JavaScript -->
  <section class="hero" id="hero"></section>

  <!-- Projects Section -->
  <h2 class="section-label">Projects</h2>
  <div class="project-grid" id="project-grid"></div>

  <!-- Footer -->
  <footer class="site-footer">
    &copy; <span id="year"></span> Harrison Grant
  </footer>

  <script src="projects.js"></script>
  <script>
    // --- Render Hero ---
    const hero = document.getElementById('hero');
    hero.innerHTML = `
      <div class="hero-text fade-in">
        <p class="hero-label">Mechanical Engineering</p>
        <h1>${SITE_CONFIG.name.split(' ')[0]}<span>${SITE_CONFIG.name.split(' ').slice(1).join(' ')}</span></h1>
        <p class="hero-about">${SITE_CONFIG.aboutText}</p>
      </div>
      <div class="hero-images fade-in">
        ${SITE_CONFIG.heroImages.map(src => `<img src="${src}" alt="${SITE_CONFIG.name}">`).join('')}
      </div>
    `;

    // --- Render Project Cards ---
    const grid = document.getElementById('project-grid');
    PROJECTS.forEach((p, i) => {
      const card = document.createElement('a');
      card.href = `project.html?id=${p.id}`;
      card.className = 'project-card fade-in';
      card.style.transitionDelay = `${i * 0.08}s`;
      card.innerHTML = `
        <img class="project-card-img" src="${p.thumbnail}" alt="${p.title}">
        <div class="project-card-body">
          <h3>${p.title}</h3>
          <p>${p.subtitle}</p>
        </div>
      `;
      grid.appendChild(card);
    });

    // --- Year ---
    document.getElementById('year').textContent = new Date().getFullYear();

    // --- Scroll fade-in ---
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.1 });
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
  </script>
</body>
</html>
